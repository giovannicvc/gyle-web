<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OnTapp — Reimposta password</title>
<style>
  :root{color-scheme:dark;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0B0B0C;
    color:#F5F0E6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:24px;
    box-sizing:border-box;
  }
  .card{
    width:100%;
    max-width:380px;
    background:#161616;
    border:1px solid #2A2A2A;
    border-radius:8px;
    padding:32px 28px;
  }
  h1{font-size:20px;margin:0 0 8px;}
  p{font-size:14px;color:#B8B2A6;line-height:1.5;}
  label{display:block;font-size:13px;margin:16px 0 6px;color:#B8B2A6;}
  input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border-radius:4px;
    border:1px solid #2A2A2A;
    background:#0B0B0C;
    color:#F5F0E6;
    font-size:15px;
  }
  button{
    width:100%;
    margin-top:24px;
    padding:13px;
    border:none;
    border-radius:4px;
    background:#F5F0E6;
    color:#0B0B0C;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  button:disabled{opacity:.5;cursor:default;}
  .msg{margin-top:16px;font-size:13px;}
  .msg.error{color:#E5484D;}
  .hidden{display:none;}
</style>
</head>
<body>
  <div class="card">
    <h1>Reimposta la password</h1>
    <p id="intro">Verifica del link in corso…</p>

    <form id="form" class="hidden">
      <label for="password">Nuova password</label>
      <input id="password" type="password" minlength="6" required autocomplete="new-password">
      <label for="confirm">Conferma password</label>
      <input id="confirm" type="password" minlength="6" required autocomplete="new-password">
      <button id="submit" type="submit">SALVA NUOVA PASSWORD</button>
    </form>

    <div id="successBox" class="hidden">
      <p>Password aggiornata. Torna all'app OnTapp e accedi con la nuova password.</p>
    </div>

    <div id="message" class="msg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://caqwasnojdureohdkhts.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhcXdhc25vamR1cmVvaGRraHRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5MTA3NDgsImV4cCI6MjA5ODQ4Njc0OH0._t70aO1nkHVyRxYVACp9AmhxF95gw_7rWaYHU1HO8MU';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const introEl = document.getElementById('intro');
    const formEl = document.getElementById('form');
    const messageEl = document.getElementById('message');
    const successBox = document.getElementById('successBox');
    const submitBtn = document.getElementById('submit');

    function showError(text) {
      messageEl.textContent = text;
      messageEl.className = 'msg error';
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');

      if (!code) {
        introEl.textContent = 'Link non valido o scaduto.';
        showError("Richiedi un nuovo link di recupero dall'app.");
        return;
      }

      const { error } = await supabase.auth.exchangeCodeForSession(code);
      if (error) {
        introEl.textContent = 'Il link non è più valido.';
        showError("Richiedi un nuovo link di recupero dall'app.");
        return;
      }

      introEl.textContent = 'Scegli una nuova password per il tuo account OnTapp.';
      formEl.classList.remove('hidden');
    }

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageEl.textContent = '';
      messageEl.className = 'msg';

      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (password.length < 6) {
        showError('La password deve avere almeno 6 caratteri.');
        return;
      }
      if (password !== confirm) {
        showError('Le password non coincidono.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'SALVATAGGIO...';

      const { error } = await supabase.auth.updateUser({ password });

      if (error) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'SALVA NUOVA PASSWORD';
        showError('Errore: ' + error.message);
        return;
      }

      formEl.classList.add('hidden');
      successBox.classList.remove('hidden');
    });

    init();
  </script>
</body>
</html>
